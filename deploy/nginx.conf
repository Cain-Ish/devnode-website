# RECONSTRUCTED, NOT THE LIVE FILE.
# Rebuilt on 2026-11-02 from the old public/.htaccess and from the live site's
# responses. It has never been run. Compare it with the config on the server
# and replace this file with the real one. Do not install it over the real one.
# The certificate paths and the docroot below are placeholders.

# Hashed build assets are immutable. Fonts and noscript.css keep their names
# between builds, so they get 30 days instead of a year.
map $uri $cache_control {
    default                  "";
    ~^/assets/               "public, max-age=31536000, immutable";
    /noscript.css            "public, max-age=2592000";
    ~\.(woff2|png|ico|svg)$  "public, max-age=2592000";
    ~\.(html|pdf)$           "public, max-age=300, must-revalidate";
}

server {
    listen 80;
    listen [::]:80;
    server_name mariuszmachuta.com www.mariuszmachuta.com;
    return 301 https://mariuszmachuta.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.mariuszmachuta.com;
    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;
    return 301 https://mariuszmachuta.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mariuszmachuta.com;
    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;

    root /path/to/docroot;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; font-src 'self'; style-src 'self'; script-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $cache_control;

    # ACME and security.txt must stay reachable past the dot-file deny below.
    location ^~ /.well-known/ {
    }

    # Dot-files and dot-directories: .env, .git/, editor and tooling folders.
    location ~ /\. {
        return 403;
    }

    # This site emits no PHP, and backups must never be served.
    location ~ \.(php|bak|old|orig|sql|sqlite|zip|tar|gz|log|ini)$ {
        return 403;
    }

    # Collapse /index.html onto /. Checks $request_uri so that the internal
    # redirect from `index index.html` does not loop.
    location = /index.html {
        if ($request_uri ~ ^/+index\.html(\?|$)) {
            return 301 /;
        }
    }

    # No catch-all redirect: unknown URLs return a genuine 404, because a 301
    # to the homepage is a soft-404 pattern.
    location / {
        try_files $uri $uri/ =404;
    }
}
